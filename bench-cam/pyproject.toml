[project]
name = "bench-cam"
version = "0.1.0"
description = "Point a webcam at your electronics bench and ask Claude about it"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
]

[project.scripts]
bench-cam = "bench_cam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_cam"]
