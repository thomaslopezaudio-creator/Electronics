; ESP32-S3-N16R8 = 16 MB flash (QIO) + 8 MB octal PSRAM (OPI).
; Those two settings below are what makes the generic devkitc-1 board
; definition match your specific module. Get them wrong and it either
; won't boot or PSRAM silently disappears.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_src_filter = +<main.cpp>
; We flash/monitor over the S3's native USB port (shows up as "USB JTAG/serial
; debug unit"). These two flags route Serial to that port instead of the UART.
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    fastled/FastLED@3.10.3   ; pinned: 3.10.5 drops the ESP32 RMT driver on this core (generic fallback = garbage output)
    esp32async/ESPAsyncWebServer@^3.7.0
    esp32async/AsyncTCP@^3.3.0

; Milestone 0: drive the devkit's own onboard WS2812 (no strip wired yet).
; Most N16R8 devkits put it on GPIO 48; a few revisions use GPIO 38.
[env:onboard-test]
build_flags =
    ${env.build_flags}
    -DLED_PIN=48
    -DNUM_LEDS=1

; Milestones 1+: the real strip on GPIO 4.
[env:strip]
build_flags =
    ${env.build_flags}
    -DLED_PIN=4
    -DNUM_LEDS=150

; Same firmware as `strip`, uploaded over WiFi instead of USB.
[env:strip-ota]
extends = env:strip
upload_protocol = espota
upload_port = 192.168.1.50

; Hardware-only check: FastLED rainbow on strip + onboard LED, no WiFi.
[env:blink]
build_src_filter = +<blink_test.cpp>
