[env:soundboard]
; C5 support requires Arduino 3.x. Pin the complete platform release.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.maximum_size = 1572864
monitor_speed = 115200
; Released RTS/DTR: the monitor otherwise held the C5 in reset (silent log).
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
; The current board uses a USB/UART bridge, so Serial is UART0.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
